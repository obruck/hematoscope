### basic settings

# site properties and page defaults
title:  
description: The official website for the Hematoscope Lab.
logo: images/logo.png
#logo: favicons/favicon.png
header: images/background.jpg
footer: images/background.jpg
baseurl: 

# site social media and other links
links:
  email: oscar.bruck@hus.fi
  google-scholar: https://scholar.google.com/citations?view_op=list_works&hl=en&user=RDtkUAgAAAAJ
  github: obruck
  twitter: oscarbruck
  #instagram: YourLabHandle
  #youtube: YourLabChannel

# automatic citations
auto-cite:
  plugins:
    - name: sources
      input:
        - ../_data/sources.yaml
  output: ../_data/citations.yaml

### advanced settings

# default front matter parameters for markdown files
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

# collections
collections:
  members:
    output: true

# sass settings
sass:
  sass_dir: css

# syntax highlighting
highlighter: rouge

# plugins
plugins:
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-sitemap
  # - jekyll-github-metadata
  # - jekyll-avatar
  # - jekyll-gist
  # - jekyll-mentions
  # - jekyll-relative-links
  # - jemoji

# jekyll theme
theme: null
