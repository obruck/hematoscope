# site properties and page defaults
title: Hematoscope Lab
#subtitle: by the Greene Lab
description: The official website for the Hematoscope Lab.
logo: images/logo.png
header: images/background.jpg
footer: images/background.jpg

# site social media and other links
links:
  email: oscar.bruck@hus.fi
  orcid: 0000-0002-7842-9419
  google-scholar: https://scholar.google.com/citations?view_op=list_works&hl=en&user=RDtkUAgAAAAJ
  github: obruck
  twitter: oscarbruck
  #youtube: YourLabChannel

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
